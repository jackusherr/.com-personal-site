<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
</head>
<body style="font-family: Charter, Georgia, serif; font-size: 18px; line-height: 1.65;">
  <div style="max-width: 640px; margin: 60px auto; padding: 0 20px;">
    <h1><a href="/" style="text-decoration: none; color: inherit;">{{ .Site.Title }}</a></h1>

    <p>
      <a href="/about/">About</a> ·
      <a href="/posts/">Archive</a>
    </p>

    {{ block "main" . }}{{ end }}

<hr style="border: none; border-top: 1px solid #ddd; margin-top: 40px;">
<p style="color: #666; display: flex; justify-content: space-between; align-items: baseline;">
  <span>
    <a href="https://twitter.com/jackusherr" style="color: #666;">Twitter/X</a> ·
    <a href="https://linkedin.com/in/jack-usher/" style="color: #666;">LinkedIn</a>
  </span>
  <span style="font-size: 0.8em;">© {{ now.Year }} {{ .Site.Title }}</span>
</p>
  </div>
</body>
</html>
