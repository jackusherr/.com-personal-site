{{ define "main" }}
  {{ range where site.RegularPages "Section" "posts" | sort ".Date" "desc" }}
    <article style="margin-bottom: 60px;">
      <h2><a href="{{ .RelPermalink }}" style="text-decoration: none; color: inherit;">{{ .Title }}</a></h2>
      <p style="color: #666;">{{ .Date.Format "January 2, 2006" }}</p>
      {{ .Content }}
    </article>
    <hr>
  {{ end }}
{{ end }}
